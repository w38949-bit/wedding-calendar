name: bump-gallery-1220
on:
  push:
    paths:
      - '.github/workflows/bump-gallery-1220.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump gallery loader
        run: |
          python - <<'PY'
          from pathlib import Path
          for fn in ['index.html','latest.html']:
              p=Path(fn)
              s=p.read_text()
              import re
              s=re.sub(r'queendom-gallery-override\.js\?v=20260819-\d+', 'queendom-gallery-override.js?v=20260819-1220', s)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html latest.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load isolated wedding photo gallery layout'
          git push
