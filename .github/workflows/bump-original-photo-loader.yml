name: Bump original photo loader cache
on:
  push:
    paths:
      - '.github/workflows/bump-original-photo-loader.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump loader version
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','latest.html']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('queendom-gallery-override.js?v=20260819-1120','queendom-gallery-override.js?v=20260819-1152')
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html latest.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use original uploaded JPG gallery loader'
          git push
