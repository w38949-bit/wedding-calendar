name: Jump from favorite card to calendar
on:
  push:
    paths:
      - '.github/workflows/apply-favorite.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch favorite card navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Make favorite cards visibly clickable.
          if '.favcardlink{' not in s:
              anchor='.favdate{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px}'
              style='.favcardlink{cursor:pointer}.favcardlink:focus{outline:2px solid var(--accent);outline-offset:2px}'
              if anchor not in s: raise SystemExit('favorite card style anchor missing')
              s=s.replace(anchor,anchor+style,1)

          # Add navigation helper before favoriteCard().
          if 'function openFavoriteCard(' not in s:
              anchor='function favoriteCard(x){'
              helper="function openFavoriteCard(id){let x=D.find(q=>favId(q)===id);if(!x)return;let [y,m]=x.date.split('-').map(Number);cur=new Date(y,m-1,1);sd=x.date;sv=x.venue;sh=x.hall||'';viewMode='browse';$('browseTab').classList.add('a');$('favTab').classList.remove('a');$('venueLabel').classList.remove('hidden');$('vt').classList.remove('hidden');$('dl').textContent=sd;cal();vt();let c=$('cal');if(c&&c.scrollIntoView)c.scrollIntoView({behavior:'smooth',block:'center'})}"
              if anchor not in s: raise SystemExit('favoriteCard anchor missing')
              s=s.replace(anchor,helper+anchor,1)

          # Add card navigation metadata to the favorite-card root.
          old='return `<div class="card"><div class="favdate">${x.date}</div>'
          new='return `<div class="card favcardlink" tabindex="0" role="button" data-open-fav="${encodeURIComponent(id)}"><div class="favdate">${x.date}</div>'
          if old in s:
              s=s.replace(old,new,1)
          elif 'data-open-fav=' not in s:
              raise SystemExit('favorite card root anchor missing')

          # Extend renderFavorites listeners: heart only toggles, card click/Enter opens matching date/venue/hall.
          pattern=r"\$\('res'\)\.querySelectorAll\('\.favbtn'\)\.forEach\(b=>b\.onclick=e=>\{e\.stopPropagation\(\);toggleFav\(decodeURIComponent\(b\.dataset\.fav\)\)\}\)\}"
          repl="$ ('res')"  # placeholder replaced below
          m=re.search(pattern,s)
          if m:
              replacement="$('res').querySelectorAll('.favbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(decodeURIComponent(b.dataset.fav))});$('res').querySelectorAll('[data-open-fav]').forEach(c=>{let go=()=>openFavoriteCard(decodeURIComponent(c.dataset.openFav));c.onclick=e=>{if(!e.target.closest('.favbtn'))go()};c.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('.favbtn')){e.preventDefault();go()}}})}"
              s=s[:m.start()]+replacement+s[m.end():]
          elif "querySelectorAll('[data-open-fav]')" not in s:
              raise SystemExit('renderFavorites listener anchor missing')

          p.write_text(s,encoding='utf-8')
          Path('latest.html').write_text(s+'\n<!-- favorite-card-jump-20260818-1235 -->\n',encoding='utf-8')
          PY
      - name: Commit favorite-card calendar jump
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html latest.html
          git commit -m "Jump from favorite card to selected calendar date" || exit 0
          git push
