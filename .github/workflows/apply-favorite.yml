name: Create unique favorites tab page
on:
  push:
    paths:
      - '.github/workflows/apply-favorite.yml'
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Copy current app to unique page
        run: |
          cp index.html favorites-tab-1232.html
          printf '\n<!-- favorites-tab-1232 -->\n' >> favorites-tab-1232.html
      - name: Commit unique page
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add favorites-tab-1232.html
          git commit -m "Add unique favorites tab test page" || exit 0
          git push
