name: Sync latest page to current app
on:
  push:
    paths:
      - '.github/workflows/apply-favorite.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy current app to latest.html
        run: |
          cp index.html latest.html
          printf '\n<!-- latest-sync-20260818-1228 -->\n' >> latest.html
      - name: Commit synced latest page
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add latest.html
          git commit -m "Sync latest page to current app" || exit 0
          git push
