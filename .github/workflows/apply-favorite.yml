name: Fix calendar date and favorite cards
on:
  push:
    paths:
      - '.github/workflows/apply-favorite.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Saturday date generation and preserve favorite cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function sat(a,b){let x=new Date(a+'T00:00:00'),z=new Date(b+'T00:00:00'),r=[];while(x.getDay()!=6)x.setDate(x.getDate()+1);for(;x<=z;x.setDate(x.getDate()+7))r.push(x.toISOString().slice(0,10));return r}"
          new="function sat(a,b){let x=new Date(a+'T00:00:00'),z=new Date(b+'T00:00:00'),r=[];while(x.getDay()!=6)x.setDate(x.getDate()+1);for(;x<=z;x.setDate(x.getDate()+7)){let y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,'0'),d=String(x.getDate()).padStart(2,'0');r.push(`${y}-${m}-${d}`)}return r}"
          if old not in s:
              raise SystemExit('sat function anchor not found')
          s=s.replace(old,new,1)
          if '.favbtn{' not in s or "wedding-calendar-card-favorites" not in s or 'data-fav=' not in s:
              raise SystemExit('favorite card code missing; refusing partial deploy')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixed page
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "Fix Saturday calendar dates and keep card favorites" || exit 0
          git push
