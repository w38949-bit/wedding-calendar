name: Bust wedding photo gallery cache
on:
  push:
    paths:
      - '.github/workflows/apply-favorite.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update photo script version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','latest.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              import re
              s,n=re.subn(r'photos\.js\?v=[0-9-]+','photos.js?v=20260818-2157',s,count=1)
              if n!=1:
                  raise SystemExit(f'{name}: photo script tag not found')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html latest.html
          git commit -m "Bust refreshed wedding photo cache" || exit 0
          git push
