name: Fix July Signature Hall price
on:
  push:
    paths:
      - '.github/workflows/apply-favorite.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix July Signature Hall 15:00+ price
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="gm(sat('2027-07-03','2027-07-11'),{'시그니처홀':[['14:00',2000000],['15:00 이후',10000000]]"
          new="gm(sat('2027-07-03','2027-07-11'),{'시그니처홀':[['14:00',2000000],['15:00 이후',1000000]]"
          if old not in s:
              raise SystemExit('July Signature Hall price anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          Path('latest.html').write_text(s+'\n<!-- july-signature-fix-20260818-1322 -->\n',encoding='utf-8')
          PY
      - name: Commit July Signature Hall price fix
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html latest.html
          git commit -m "Set July Signature Hall 15:00+ to 1,000,000 won" || exit 0
          git push
