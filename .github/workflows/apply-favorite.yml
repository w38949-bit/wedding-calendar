name: Fix Grand Moment meal totals fallback
on:
  push:
    paths:
      - '.github/workflows/apply-favorite.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix total fallback and keep split totals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          bad="return `${totalBlock(x)}`}function favoriteCard(x){"
          good="return `<div class=\"total\"><span>350명 예상총액</span><b>${x.total==null?'대관비 확인 필요':M(x.total)}</b></div>`}function favoriteCard(x){"
          if bad not in s:
              raise SystemExit('bad total fallback anchor missing')
          s=s.replace(bad,good,1)
          p.write_text(s,encoding='utf-8')
          Path('latest.html').write_text(s+'\n<!-- grand-moment-split-totals-fixed-20260818-1327 -->\n',encoding='utf-8')
          PY
      - name: Commit total fallback fix
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html latest.html
          git commit -m "Fix non-Grand-Moment total fallback" || exit 0
          git push
