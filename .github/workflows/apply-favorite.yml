name: Connect wedding hall photo gallery
on:
  push:
    paths:
      - '.github/workflows/apply-favorite.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load photo gallery module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          tag='<script src="photos.js?v=20260818-2137"></script>'
          for name in ('index.html','latest.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'photos.js?v=20260818-2137' not in s:
                  if '</body>' not in s:
                      raise SystemExit(f'body anchor missing in {name}')
                  s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit photo gallery connection
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html latest.html
          git commit -m "Load wedding hall photo gallery" || exit 0
          git push
