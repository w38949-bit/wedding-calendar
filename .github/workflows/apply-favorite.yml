name: Migrate existing favorites into shared database
on:
  push:
    paths:
      - '.github/workflows/apply-favorite.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add legacy favorite migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="async function initSharedFavorites(){await loadSharedFavorites(false);cal();sel(Object.keys(B).sort()[0]);setInterval(()=>loadSharedFavorites(true),3000)}initSharedFavorites();"
          new="async function migrateLegacyFavorites(){try{let raw=localStorage.getItem('wedding-calendar-card-favorites');if(!raw)return;let old=JSON.parse(raw);if(!Array.isArray(old)||!old.length){localStorage.removeItem('wedding-calendar-card-favorites');return}let r=await fetch(`${SUPABASE_URL}/rest/v1/${FAV_TABLE}`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',Prefer:'resolution=ignore-duplicates'},body:JSON.stringify(old.map(favorite_id=>({favorite_id})))});if(!r.ok)throw new Error(`migration ${r.status}`);localStorage.removeItem('wedding-calendar-card-favorites')}catch(e){console.error('legacy favorite migration failed',e)}}async function initSharedFavorites(){await migrateLegacyFavorites();await loadSharedFavorites(false);cal();sel(Object.keys(B).sort()[0]);setInterval(()=>loadSharedFavorites(true),3000)}initSharedFavorites();"
          if old not in s:
              raise SystemExit('shared init anchor missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          Path('latest.html').write_text(s+'\n<!-- shared-favorites-legacy-migration-20260818-1250 -->\n',encoding='utf-8')
          PY
      - name: Commit legacy favorite migration
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html latest.html
          git commit -m "Migrate local favorites to shared Supabase" || exit 0
          git push
