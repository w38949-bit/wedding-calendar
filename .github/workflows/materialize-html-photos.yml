name: Materialize HTML-derived wedding photos

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/materialize-html-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Save exact images extracted from supplied HTMLs
        shell: bash
        run: |
          python -m pip install --quiet requests pillow
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from PIL import Image, ImageOps
          import io, json, re, requests, shutil

          GM = {
            'classic': [
              'https://postfiles.pstatic.net/MjAyNDA1MTlfMjAz/MDAxNzE2MTMwNTU0OTE5.GVtPew6Dc5jr5Ec_bV_jvlkJMlWGqNq0Sp6zPwETsngg.b9pY3v5ADiVMkrUfwLvrO0rDjpKDYQ7ah_tdNdUmxTUg.JPEG/SE-f3be011d-01f5-45b2-b72f-19e482102fdb.jpg?type=w773',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMjcg/MDAxNzE2MTMxMTMyODYw.lE6dCuU_PONSCvRRJrn9kwepXLFC22fJY2i465m1O9Eg._DcFwPQgdbsC_ekX3R_37sm576KKJLj2gQBvwu_WMWgg.JPEG/SE-782e354d-86df-496e-8d57-7ce2c8996e62.jpg?type=w773',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMjIg/MDAxNzE2MTMxMjc2ODg4.tC_Qflr1izQcCapl_d7uekGj49bPf4LG4FwL0Fph-5Ug.42NtHy7-yjmOFIXUtXUFK6kHogydC47zJnMBTu0ersYg.JPEG/SE-37c1fcf6-62b1-4b26-b667-9341300c78ef.jpg?type=w386',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMjIy/MDAxNzE2MTMxMzE2Mjcw.xLuKt-j2i7UJrsIY0sWhJ5v_YoEsfI6aR_Hc36Qu4x4g.yZIJewSIHa6EqnCOar3hO4Pk134jDh64I8nLjecrteEg.JPEG/SE-b7cb60cc-8f6a-4625-905a-118964aef97f.jpg?type=w386'
            ],
            'ella': [
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMTIw/MDAxNzE2MTMyMDQxMTgw.ktA5GHw0cZZLbrhgv7X5dA0WJihaPKKTZrwpM_mpqJYg.xt_mcVN0Ktqs0OYsyyXCoygUy0vnARrRViLueEPoY4og.JPEG/SE-b0b914e8-7dd5-43ca-b34b-432d2e9c51e4.jpg?type=w773',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMjA4/MDAxNzE2MTMyMDc2Njgz.bWVcpi2Fb0C8AHhGjonqKqNOJrHohrQi7i3qwDHJjFcg.agXqauQMUNkOBiCxRKqQmMwaThLU0TjQq4gdeMPQ0mkg.JPEG/SE-c9622706-eb50-4593-b1b8-41630318376a.jpg?type=w386',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfNjQg/MDAxNzE2MTMxOTQxMzgy.AKuhnxpkpub8pub0Ueh5sJ8AyINtb2mqLVsNQyuS0PAg.D1L8w0UiW1ohoKoS-Z-oSpA4z9APmsze2vEBrwFOZOog.JPEG/KakaoTalk_Photo_2024-05-02-03-08-37_022.jpeg?type=w386',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMTgw/MDAxNzE2MTMxOTQxNzI0.6WskO29_Td44l4kbC0YNcZOUSQzcBmlxQaBeO6fkB-8g.iGAa6zYD4DbaKmtAUn3dOfSWJjFSO7BF4LL8_QxaZicg.JPEG/KakaoTalk_Photo_2024-05-02-03-08-36_021.jpeg?type=w773'
            ],
            'veil': [
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMjIy/MDAxNzE2MTMxNzAxMjYy.G4arIOoUDLF_74HeMSRwNO-HXZqC4IvtbrA-_8HULlMg.fskOVgwd3n324urH6dQzB5TBQm5q5VWy1crAWpecZRAg.JPEG/SE-924d08bc-acaf-49b8-8ed7-17d757aa9cbf.jpg?type=w773',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfNzcg/MDAxNzE2MTM1MTYzNjky.yQZnr6cATE_2h8THiYFTjRqmQMdOVSikRpSGY5OVD6gg.KctUBhYwsMY2y3RNDwVewPbGkUR3XeOz-DFF5CqTnesg.JPEG/SE-45113b87-4dfc-4de1-90ec-067175baf1e0.jpg?type=w773',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMTI5/MDAxNzE2MTMxNjI1MTc2.G1H-lfq9nkkFvvf-bi-2RsDdg0zxzEUZwF28z029664g.ePO--kUtOsoWg3Dlvckl-p3kjaN5RiCPgry0LUEWYnYg.JPEG/KakaoTalk_Photo_2024-05-02-03-08-32_015.jpeg?type=w773'
            ],
            'opera': [
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMSAg/MDAxNzE2MTM1NjI0Mzc4.3FexpYf4DiU2eMl0eiv5YQfuhwtqS23XCi8BQbXhePMg.5UkULGxat3Q2IAy9Xj-cUm1GgHky5dkQdeEblcBuiMcg.JPEG/SE-e1dbd95e-d1ac-470e-99c2-46a95a6478ca.jpg?type=w773',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMjM4/MDAxNzE2MTMyMTY5MjYz.XeK3EBjgKvCMtDIlz5UzV9DJshtdeLKyaliB596gqvUg.POwP0KII2aarkkgsEmsZoSg2cpYtTPWpwCJ89r6UtaMg.JPEG/KakaoTalk_Photo_2024-05-02-03-08-27_008.jpeg?type=w773',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMTU4/MDAxNzE2MTMyODEyMjk0.-2rYhmPfclxYSMy0arI1eE0gQBdV18kPFHvIstisU3Yg.yH_op3lWM3dKLVSYOjmJ24ZxotOOJf7voJrMahOYgb4g.JPEG/IMG_8479.jpg?type=w773'
            ],
            'signature': [
              'https://postfiles.pstatic.net/MjAyNDA1MjBfOTgg/MDAxNzE2MTMyMzg2Mjk5._s8j_Oi7RQCp4Ae7pdUiFWc_mtHS8G6BdwLKgPBxNaMg.CVlICyoUv3L3_D8_TDheyAr0Eti3t9FoaNF0-y7QQbwg.JPEG/SE-8025d2f0-382d-4a8e-ab7c-18da226fc271.jpg?type=w773',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMjYg/MDAxNzE2MTMyNTQ2MjA2.A31qsYd2swsFLX6orsUAcgolgTaFx8OWEY44YAc9V08g.7oK4mJU1K6uehDnZj5g8IMKPzyDnwWsujKIdu0wbpVYg.JPEG/SE-54c1d615-407e-4077-b23a-bd978d42d2f5.jpg?type=w773',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfNjkg/MDAxNzE2MTMyNDU0NjQw.1J0XFRilBNknyQKBPLkvvNQ3LDyZmcMbAUAuGpnzy8Yg.XzlsIPcYJraoesnsEfTCX_8rQPhOhkIXgSuPf5CMlwog.JPEG/SE-722499c6-e4f0-4a00-903a-db1f01f6b553.jpg?type=w773',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMjMy/MDAxNzE2MTMyMjgyMDQ3.-5g8WeDf1NhU-mWHDU_Xnm5SCZ7z2IWSFo7qAj26w0wg.Sd6qBG_MK3gM8tvZvObbOCtCr3U2zkp8pwXz8kKjmx0g.JPEG/KakaoTalk_Photo_2024-05-02-03-08-43_029.jpeg?type=w386',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMTE4/MDAxNzE2MTMyNDk3MDQ0.UF_pPLk8B3vMQDGT5YJYOLQ5iKOFL3UAvGzUKk2vMTQg.PXzLa2YdtGILWBI2ckbuK5YHB-2jyqfsIPtHV2UVpa4g.JPEG/SE-bff900f0-05eb-4440-a082-438f4ccc666b.jpg?type=w386',
              'https://postfiles.pstatic.net/MjAyNDA1MjBfMTMx/MDAxNzE2MTMyMzEwNDc4.y4p8W9XIIajg4IDPrucVaWOAEF8LpRSr_G40It4yiiAg.nP3b6EBO-qDGF5OyrEnVYiIi9K2FGLCN_f9Io5EbCmAg.JPEG/KakaoTalk_Photo_2024-05-02-03-09-23_004.jpeg?type=w773'
            ]
          }

          GB = json.loads(Path('queendom-target-urls.json').read_text(encoding='utf-8'))
          if len(GB) != 9:
            raise SystemExit(f'Expected 9 Queendom URLs, got {len(GB)}')

          worker = 'https://naver-img-proxy.5126537.workers.dev/?url='
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'

          def fetch_image(url):
            errors=[]
            for target,headers in [
              (worker + quote(url, safe=''), {'User-Agent':ua}),
              (url, {'User-Agent':ua,'Referer':'https://blog.naver.com/'})
            ]:
              try:
                r=requests.get(target,headers=headers,timeout=45,allow_redirects=True)
                r.raise_for_status()
                im=Image.open(io.BytesIO(r.content)); im.load()
                return ImageOps.exif_transpose(im).convert('RGB')
              except Exception as e:
                errors.append(str(e))
            raise RuntimeError(' | '.join(errors))

          gmroot=Path('assets/grand-moment/html')
          gbroot=Path('assets/grand-blanc/queendom')
          for root in (gmroot,gbroot):
            if root.exists(): shutil.rmtree(root)
            root.mkdir(parents=True,exist_ok=True)

          for hall,urls in GM.items():
            for i,url in enumerate(urls,1):
              im=fetch_image(url)
              out=gmroot/f'{hall}-{i:02d}.jpg'
              im.thumbnail((1600,1600))
              im.save(out,'JPEG',quality=88,optimize=True)
              Image.open(out).verify()

          for i,url in enumerate(GB,1):
            im=fetch_image(url)
            out=gbroot/f'{i:02d}.jpg'
            im.thumbnail((1600,1600))
            im.save(out,'JPEG',quality=88,optimize=True)
            Image.open(out).verify()

          if len(list(gmroot.glob('*.jpg'))) != 20: raise SystemExit('GM local count != 20')
          if len(list(gbroot.glob('*.jpg'))) != 9: raise SystemExit('GB local count != 9')

          p=Path('photos-20260819-1031.js')
          s=p.read_text(encoding='utf-8')
          source_gm='https://m.blog.naver.com/qorrkdnjs/223451943421'
          source_gb='https://m.blog.naver.com/rh30921/224144337505'
          replacements={
            '시그니처홀': [f'assets/grand-moment/html/signature-{i:02d}.jpg' for i in range(1,7)],
            '베일홀': [f'assets/grand-moment/html/veil-{i:02d}.jpg' for i in range(1,4)],
            '클래식홀': [f'assets/grand-moment/html/classic-{i:02d}.jpg' for i in range(1,5)],
            '엘라홀': [f'assets/grand-moment/html/ella-{i:02d}.jpg' for i in range(1,5)],
            '오페라홀': [f'assets/grand-moment/html/opera-{i:02d}.jpg' for i in range(1,4)],
          }
          for hall,imgs in replacements.items():
            arr=','.join(json.dumps(x,ensure_ascii=False) for x in imgs)
            pat=rf"'{re.escape(hall)}':\{{source:[^,]+,imgs:\[.*?\]\}}"
            rep=f"'{hall}':{{source:{json.dumps(source_gm,ensure_ascii=False)},imgs:[{arr}]}}"
            s,n=re.subn(pat,rep,s,count=1,flags=re.S)
            if n!=1: raise SystemExit(f'Failed to replace {hall}: {n}')

          qimgs=','.join(json.dumps(f'assets/grand-blanc/queendom/{i:02d}.jpg') for i in range(1,10))
          qrep=f"'퀸덤홀(화이트홀)':{{source:{json.dumps(source_gb,ensure_ascii=False)},imgs:[{qimgs}]}}"
          s,n=re.subn(r"'퀸덤홀\(화이트홀\)':\{source:[^,]+,imgs:\[.*?\]\}",qrep,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'Failed to replace Queendom: {n}')

          s=s.replace("${count<10?' · 추가 원본 확인 중':''}",'')
          s=s.replace('사진 ${i+1} · 출처 보기','출처 보기')
          p.write_text(s,encoding='utf-8')

          version='20260819-1108'
          for name in ('index.html','latest.html'):
            q=Path(name); t=q.read_text(encoding='utf-8')
            t=re.sub(r'<script src="queendom-gallery-override\.js[^"]*"></script>','',t)
            t=re.sub(r'photos-20260819-1031\.js(?:\?v=[^\"]+)?',f'photos-20260819-1031.js?v={version}',t)
            q.write_text(t,encoding='utf-8')
          PY

      - name: Commit actual local JPGs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/grand-moment/html assets/grand-blanc/queendom photos-20260819-1031.js index.html latest.html
          git diff --cached --quiet && exit 0
          git commit -m 'Store supplied HTML photos as local JPGs'
          git push origin main
