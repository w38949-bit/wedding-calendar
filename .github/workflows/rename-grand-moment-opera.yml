name: Rename Grand Moment White Hall to Opera Hall

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-grand-moment-opera.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename Grand Moment hall and bust photo cache
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','latest.html','photos.js']:
              p=Path(name)
              s=p.read_text()
              s=s.replace("'화이트홀'", "'오페라홀'")
              p.write_text(s)
          for name in ['index.html','latest.html']:
              p=Path(name)
              s=p.read_text()
              import re
              s=re.sub(r'photos\.js\?v=[^"<]+', 'photos.js?v=20260819-0957', s)
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html latest.html photos.js
          git diff --cached --quiet && exit 0
          git commit -m "Rename Grand Moment White Hall to Opera Hall"
          git push origin main
