name: Apply photo proxy fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-photo-proxy-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch photo script includes
        run: |
          python - <<'PY'
          from pathlib import Path
          old='<script src="photos.js?v=20260818-2157"></script>'
          new='<script src="photos.js?v=20260818-2157"></script><script src="photo-proxy-fix.js?v=20260818-2206"></script>'
          for name in ['index.html','latest.html']:
              p=Path(name)
              s=p.read_text()
              if 'photo-proxy-fix.js?v=20260818-2206' not in s:
                  s=s.replace(old,new)
                  p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html latest.html
          git diff --cached --quiet || git commit -m "Use proxy fallback for Kakao wedding photos"
          git push
