name: Bump photo layout cache 1156
on:
  push:
    branches: [main]
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump gallery loader version
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','latest.html']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('queendom-gallery-override.js?v=20260819-1152','queendom-gallery-override.js?v=20260819-1156')
              p.write_text(s)
          PY
      - name: Commit if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html latest.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh natural photo gallery layout"
          git push
