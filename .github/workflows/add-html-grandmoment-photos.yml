name: Finalize Grand Moment photos from supplied HTML

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/add-html-grandmoment-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove legacy misclassified Naver block
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('photos.js'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'/\* NAVER_GRANDMOMENT_EXTRA_START \*/.*?/\* NAVER_GRANDMOMENT_EXTRA_END \*/\s*','',s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          for name in ('index.html','latest.html'):
              q=Path(name); t=q.read_text(encoding='utf-8')
              t=re.sub(r'photos\.js\?v=[^\"\']+','photos.js?v=20260819-1022',t)
              q.write_text(t,encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photos.js index.html latest.html
          git diff --cached --quiet && exit 0
          git commit -m 'Keep only correctly classified Grand Moment HTML photos'
          git push origin main
