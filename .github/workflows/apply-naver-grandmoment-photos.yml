name: Apply Naver Grand Moment photos

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/apply-naver-grandmoment-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Merge classified Naver photos into gallery
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path

          p=Path('photos.js')
          s=p.read_text(encoding='utf-8')
          data=json.loads(Path('naver-grandmoment-extract.json').read_text(encoding='utf-8'))
          source=data['source']
          halls=['시그니처홀','베일홀','클래식홀','엘라홀','화이트홀']
          extra={h:[] for h in halls}
          for x in data['items']:
            if x.get('type')=='image' and x.get('hall') in extra:
              u=x['url']
              # Request a larger Naver rendition where possible.
              u=re.sub(r'([?&])type=w\d+(?:_blur)?',r'\1type=w1600',u)
              if u not in extra[x['hall']]: extra[x['hall']].append(u)

          marker_start='/* NAVER_GRANDMOMENT_EXTRA_START */'
          marker_end='/* NAVER_GRANDMOMENT_EXTRA_END */'
          block=marker_start+'\n'+f"const NAVER_GM_SOURCE={json.dumps(source,ensure_ascii=False)};\n"+f"const NAVER_GM_EXTRA={json.dumps(extra,ensure_ascii=False)};\n"+"Object.entries(NAVER_GM_EXTRA).forEach(([h,imgs])=>{const g=PHOTO['그랜드 모먼트']&&PHOTO['그랜드 모먼트'][h];if(g){g.extraSource=NAVER_GM_SOURCE;g.extraImgs=[...new Set([...(g.extraImgs||[]),...imgs])]}});\n"+marker_end
          if marker_start in s:
            s=re.sub(re.escape(marker_start)+r'.*?'+re.escape(marker_end),block,s,flags=re.S)
          else:
            anchor='\n\nconst style=document.createElement(\'style\');'
            if anchor not in s: raise SystemExit('style anchor not found')
            s=s.replace(anchor,'\n\n'+block+anchor,1)

          old="const count=g.imgs.length;"
          new="const entries=[...g.imgs.map(src=>({src,source:g.source})),...(g.extraImgs||[]).map(src=>({src,source:g.extraSource||g.source}))];const count=entries.length;"
          if old in s: s=s.replace(old,new,1)

          old_map="g.imgs.map((src,i)=>`<div class=\"photoitem\"><a href=\"${src}\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"${src}\" loading=\"lazy\" alt=\"${photoVenue} ${photoHall||''} 사진 ${i+1}\" referrerpolicy=\"no-referrer\" onerror=\"this.closest('.photoitem').classList.add('broken')\"></a><a class=\"photosource\" href=\"${g.source}\" target=\"_blank\" rel=\"noopener noreferrer\">사진 ${i+1} · 출처 보기</a></div>`).join('')"
          new_map="entries.map((it,i)=>`<div class=\"photoitem\"><a href=\"${it.src}\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"${it.src}\" loading=\"lazy\" alt=\"${photoVenue} ${photoHall||''} 사진 ${i+1}\" referrerpolicy=\"no-referrer\" onerror=\"this.closest('.photoitem').classList.add('broken')\"></a><a class=\"photosource\" href=\"${it.source}\" target=\"_blank\" rel=\"noopener noreferrer\">사진 ${i+1} · 출처 보기</a></div>`).join('')"
          if old_map in s: s=s.replace(old_map,new_map,1)
          elif 'entries.map((it,i)' not in s:
            raise SystemExit('gallery map anchor not found')

          p.write_text(s,encoding='utf-8')
          print({h:len(v) for h,v in extra.items()})
          PY
      - name: Bust gallery script cache in app pages
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ('index.html','latest.html'):
            p=Path(name); s=p.read_text(encoding='utf-8')
            s=re.sub(r'photos\.js\?v=[^\"\']+', 'photos.js?v=20260818-2245', s)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit imported photos
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photos.js index.html latest.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add provided Naver Grand Moment hall photos'
          git push origin main
