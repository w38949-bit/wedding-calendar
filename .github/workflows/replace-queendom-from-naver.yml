name: Replace Grand Blanc Queendom photos

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/replace-queendom-from-naver.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Queendom photos from source post
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 pillow
          python - <<'PY'
          import re, requests, shutil
          from pathlib import Path
          from bs4 import BeautifulSoup
          from PIL import Image
          from io import BytesIO
          from urllib.parse import quote

          source='https://m.blog.naver.com/rh30921/224144337505'
          post='https://blog.naver.com/PostView.naver?blogId=rh30921&logNo=224144337505'
          worker='https://naver-img-proxy.5126537.workers.dev/?url='+quote(post,safe='')
          allorigins='https://api.allorigins.win/raw?url='+quote(post,safe='')
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
            'Accept-Language':'ko-KR,ko;q=0.9,en;q=0.8',
            'Referer':'https://blog.naver.com/'
          }
          html=None
          for url in (post,worker,allorigins):
            try:
              r=requests.get(url,headers=headers,timeout=35)
              print('fetch',url,'status',r.status_code,'bytes',len(r.content))
              if r.ok and ('postfiles.pstatic.net' in r.text or 'blogfiles.pstatic.net' in r.text):
                html=r.text; break
            except Exception as e:
              print('fetch failed',url,e)
          if not html:
            raise SystemExit('Could not fetch Naver post HTML')

          soup=BeautifulSoup(html,'html.parser')
          urls=[]
          # SmartEditor resource images, in article order.
          candidates=soup.select('img.se-image-resource') or soup.find_all('img')
          for img in candidates:
            src=img.get('data-lazy-src') or img.get('data-src') or img.get('src') or ''
            if ('postfiles.pstatic.net' in src or 'blogfiles.pstatic.net' in src) and src not in urls:
              urls.append(src)
          print('article image count',len(urls))
          if len(urls)<15:
            # fallback: extract pstatic image URLs from HTML in first-occurrence order
            rx=re.compile(r'https?://(?:postfiles|blogfiles)\.pstatic\.net/[^\"\'<> ]+')
            for src in rx.findall(html.replace('\\u0026','&')):
              src=src.replace('&amp;','&')
              if src not in urls: urls.append(src)
            print('fallback image count',len(urls))
          if len(urls)<15:
            raise SystemExit(f'Expected at least 15 article images, got {len(urls)}')

          # Supplied HTML has 32 body figures; Queendom is figures 7 through 15 inclusive.
          urls=urls[6:15]
          if len(urls)!=9:
            raise SystemExit(f'Queendom slice count={len(urls)}')

          root=Path('assets/grand-blanc/queendom')
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True,exist_ok=True)
          saved=[]
          for i,url in enumerate(urls,1):
            url=re.sub(r'([?&])type=w\d+(?:_blur)?',r'\1type=w1600',url)
            rr=requests.get(url,headers=headers,timeout=35)
            rr.raise_for_status()
            im=Image.open(BytesIO(rr.content)).convert('RGB')
            im.thumbnail((1600,1600))
            path=root/f'{i:02d}.jpg'
            im.save(path,'JPEG',quality=85,optimize=True)
            saved.append(str(path).replace('\\','/'))
          (root/'source.txt').write_text(source+'\n',encoding='utf-8')
          print('saved',saved)
          PY

      - name: Replace gallery set
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('photos.js')
          s=p.read_text(encoding='utf-8')
          new="'퀸덤홀(화이트홀)':{source:'https://m.blog.naver.com/rh30921/224144337505',imgs:["+','.join([f"'assets/grand-blanc/queendom/{i:02d}.jpg'" for i in range(1,10)])+"]}"
          pattern=r"'퀸덤홀\(화이트홀\)':\{source:'[^']*',imgs:\[.*?\]\}"
          s2,n=re.subn(pattern,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'Queendom gallery object replacement count={n}')
          p.write_text(s2,encoding='utf-8')
          version='20260819-1024'
          for name in ('index.html','latest.html'):
            q=Path(name); t=q.read_text(encoding='utf-8')
            t=re.sub(r'photos\.js\?v=[^\"\']+',f'photos.js?v={version}',t)
            q.write_text(t,encoding='utf-8')
          PY

      - name: Commit replacement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/grand-blanc/queendom photos.js index.html latest.html
          git diff --cached --quiet && exit 0
          git commit -m 'Replace Grand Blanc Queendom photos from supplied source'
          git push origin main
