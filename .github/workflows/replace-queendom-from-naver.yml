name: Replace Grand Blanc Queendom photos

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/replace-queendom-from-naver.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Diagnose Naver source access
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          from urllib.parse import quote
          from pathlib import Path
          post='https://blog.naver.com/PostView.naver?blogId=rh30921&logNo=224144337505'
          worker='https://naver-img-proxy.5126537.workers.dev/?url='+quote(post,safe='')
          allorigins='https://api.allorigins.win/raw?url='+quote(post,safe='')
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Referer':'https://blog.naver.com/','Accept-Language':'ko-KR,ko;q=0.9'}
          lines=[]
          for label,url in [('direct',post),('worker',worker),('allorigins',allorigins)]:
            try:
              r=requests.get(url,headers=headers,timeout=25)
              text=r.text
              soup=BeautifulSoup(text,'html.parser')
              smart=[]
              for img in soup.select('img.se-image-resource'):
                src=img.get('data-lazy-src') or img.get('data-src') or img.get('src') or ''
                if 'pstatic.net' in src and src not in smart: smart.append(src)
              rx=[]
              for src in re.findall(r'https?://(?:postfiles|blogfiles)\.pstatic\.net/[^\"\'<> ]+',text.replace('\\u0026','&')):
                src=src.replace('&amp;','&')
                if src not in rx: rx.append(src)
              lines.append(f'{label}: status={r.status_code} bytes={len(r.content)} smart={len(smart)} regex={len(rx)} queendom={"퀸덤홀" in text} caros={"카로스홀" in text}')
            except Exception as e:
              lines.append(f'{label}: ERROR {type(e).__name__}: {e}')
          Path('queendom-fetch-debug.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add queendom-fetch-debug.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record Queendom photo source diagnostics'
          git push origin main
