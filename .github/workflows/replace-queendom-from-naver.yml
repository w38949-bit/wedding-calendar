name: Replace Grand Blanc Queendom photos

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/replace-queendom-from-naver.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Queendom photos from source post
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 pillow
          python - <<'PY'
          import re, requests, shutil
          from pathlib import Path
          from bs4 import BeautifulSoup
          from PIL import Image
          from io import BytesIO
          from urllib.parse import quote

          source='https://m.blog.naver.com/rh30921/224144337505'
          post='https://blog.naver.com/PostView.naver?blogId=rh30921&logNo=224144337505'
          worker='https://naver-img-proxy.5126537.workers.dev/?url='+quote(post,safe='')
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
            'Accept-Language':'ko-KR,ko;q=0.9,en;q=0.8',
            'Referer':'https://blog.naver.com/'
          }
          html=None
          for url in (post,worker):
            try:
              r=requests.get(url,headers=headers,timeout=30)
              if r.ok and ('퀸덤홀' in r.text or 'postfiles.pstatic.net' in r.text):
                html=r.text
                print('fetched',url,'bytes',len(html)); break
            except Exception as e:
              print('fetch failed',url,e)
          if not html:
            raise SystemExit('Could not fetch Naver post HTML')

          soup=BeautifulSoup(html,'html.parser')
          sequence=[]
          seen=[]
          for el in soup.find_all(['p','span','div','img']):
            if el.name=='img':
              src=el.get('data-lazy-src') or el.get('data-src') or el.get('src') or ''
              if 'pstatic.net' in src and src not in seen:
                seen.append(src); sequence.append(('img',src))
            else:
              text=el.get_text(' ',strip=True)
              if text and (('퀸덤홀' in text) or ('퀸텀홀' in text) or ('카로스홀' in text)):
                sequence.append(('text',text))

          start=None; end=None
          for i,(typ,val) in enumerate(sequence):
            if typ=='text' and start is None and ('퀸덤홀 입구' in val or '퀸텀홀 입구' in val): start=i
            if typ=='text' and start is not None and ('카로스홀 입구' in val): end=i; break
          if start is None:
            for i,(typ,val) in enumerate(sequence):
              if typ=='text' and ('먼저 퀸덤홀' in val or '먼저 퀸텀홀' in val): start=max(0,i-1); break
          if end is None and start is not None:
            for i in range(start+1,len(sequence)):
              typ,val=sequence[i]
              if typ=='text' and '카로스홀' in val: end=i; break
          if start is None or end is None:
            raise SystemExit(f'Could not locate Queendom section boundaries: start={start}, end={end}')
          urls=[]
          for typ,val in sequence[start:end]:
            if typ=='img' and val not in urls: urls.append(val)
          print('section image count',len(urls))
          if len(urls)<9:
            raise SystemExit(f'Expected at least 9 Queendom images, got {len(urls)}')
          urls=urls[:9]

          root=Path('assets/grand-blanc/queendom')
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True,exist_ok=True)
          saved=[]
          for i,url in enumerate(urls,1):
            url=re.sub(r'([?&])type=w\d+(?:_blur)?',r'\1type=w1600',url)
            rr=requests.get(url,headers=headers,timeout=30)
            rr.raise_for_status()
            im=Image.open(BytesIO(rr.content)).convert('RGB')
            im.thumbnail((1600,1600))
            path=root/f'{i:02d}.jpg'
            im.save(path,'JPEG',quality=85,optimize=True)
            saved.append(str(path).replace('\\','/'))
          (root/'source.txt').write_text(source+'\n',encoding='utf-8')
          print('saved',saved)
          PY

      - name: Replace gallery set
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p=Path('photos.js')
          s=p.read_text(encoding='utf-8')
          new="'퀸덤홀(화이트홀)':{source:'https://m.blog.naver.com/rh30921/224144337505',imgs:["+','.join([f"'assets/grand-blanc/queendom/{i:02d}.jpg'" for i in range(1,10)])+"]}"
          pattern=r"'퀸덤홀\(화이트홀\)':\{source:'[^']*',imgs:\[.*?\]\}"
          s2,n=re.subn(pattern,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'Queendom gallery object replacement count={n}')
          p.write_text(s2,encoding='utf-8')

          version='20260819-1018'
          for name in ('index.html','latest.html'):
            q=Path(name); t=q.read_text(encoding='utf-8')
            t=re.sub(r'photos\.js\?v=[^\"\']+',f'photos.js?v={version}',t)
            q.write_text(t,encoding='utf-8')
          PY

      - name: Commit replacement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/grand-blanc/queendom photos.js index.html latest.html
          git diff --cached --quiet && exit 0
          git commit -m 'Replace Grand Blanc Queendom photos from supplied source'
          git push origin main
