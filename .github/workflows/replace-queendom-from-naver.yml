name: Replace Grand Blanc Queendom photos

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/replace-queendom-from-naver.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact Queendom JPGs
        shell: bash
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json, shutil, requests
          from pathlib import Path
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://blog.naver.com/'}
          urls=json.loads(Path('queendom-target-urls.json').read_text(encoding='utf-8'))
          if len(urls)!=9: raise SystemExit(f'need 9 urls, got {len(urls)}')
          root=Path('assets/grand-blanc/queendom')
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True,exist_ok=True)
          for i,url in enumerate(urls,1):
              r=requests.get(url,headers=headers,timeout=40)
              r.raise_for_status()
              if len(r.content)<5000: raise SystemExit(f'image {i} too small: {len(r.content)}')
              (root/f'{i:02d}.jpg').write_bytes(r.content)
          (root/'source.txt').write_text('https://m.blog.naver.com/rh30921/224144337505\n',encoding='utf-8')
          PY

      - name: Point Queendom gallery only to local JPGs
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('photos.js'); s=p.read_text(encoding='utf-8')
          imgs=','.join(json.dumps(f'assets/grand-blanc/queendom/{i:02d}.jpg') for i in range(1,10))
          new=f"'퀸덤홀(화이트홀)':{{source:'https://m.blog.naver.com/rh30921/224144337505',imgs:[{imgs}]}}"
          pat=r"'퀸덤홀\(화이트홀\)':\{source:[^,]+,imgs:\[.*?\]\}"
          s,n=re.subn(pat,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'replacement count={n}')
          p.write_text(s,encoding='utf-8')
          for name in ('index.html','latest.html'):
              q=Path(name); t=q.read_text(encoding='utf-8')
              t=re.sub(r'photos\.js\?v=[^\"\']+','photos.js?v=20260819-1050',t)
              q.write_text(t,encoding='utf-8')
          PY

      - name: Commit local Queendom replacement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/grand-blanc/queendom photos.js index.html latest.html
          git diff --cached --quiet && exit 0
          git commit -m 'Store Queendom photos locally and replace gallery'
          git push origin main
