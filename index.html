<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>웨딩홀 비교 달력</title><style>body{font-family:Arial,sans-serif;background:#f6f3ef;color:#262320;margin:0}main{max-width:1100px;margin:auto;padding:24px}.g{display:grid;grid-template-columns:1fr 1fr;gap:20px}.p{background:#fff;border:1px solid #e4ddd6;border-radius:18px;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.cal,.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.wk div{text-align:center;color:#777;font-size:12px}.d{min-height:64px;border:1px solid #e4ddd6;border-radius:12px;padding:7px;cursor:pointer;background:#fff}.d.on{background:#fcf7f2}.d.sel{outline:2px solid #7a5c48}.d.e{visibility:hidden}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}.tab{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;font-weight:700}.tab.a{background:#7a5c48;color:#fff}.hall .tab.a{background:#efe5dc;color:#5e4434}.card{border:1px solid #e4ddd6;border-radius:14px;padding:14px;margin-top:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.s{background:#faf7f4;padding:10px;border-radius:10px}.t{background:#efe5dc;padding:12px;border-radius:10px;margin-top:10px}.t span{display:block;font-size:11px;color:#77716b;margin-bottom:3px}.t b{display:block;font-size:20px;line-height:1.2;color:#5e4434}.muted{color:#777;font-size:12px}button{cursor:pointer}h1{margin:0 0 6px}@media(max-width:800px){.g{grid-template-columns:1fr}}</style><main><h1>웨딩홀 비교 달력</h1><div class="muted">2027년 토요일 · 350명 예상총액 = 대관비 + 350명 식대</div><div class="g"><section class="p"><div class="top"><h2 id="mt"></h2><div><button id="pv">←</button><button id="nx">→</button></div></div><div class="wk"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div id="cal" class="cal"></div></section><section class="p"><h2 id="dl">날짜를 선택하세요</h2><div class="muted">웨딩홀</div><div id="vt" class="tabs"></div><div class="muted">내부 홀</div><div id="ht" class="tabs hall"></div><div id="res"></div></section></div></main><script>
const D=[],$=(x)=>document.getElementById(x),M=n=>n.toLocaleString('ko-KR')+'원';
function sat(a,b){let x=new Date(a);while(x.getDay()!=6)x.setDate(x.getDate()+1);let r=[];for(;x<=new Date(b);x.setDate(x.getDate()+7))r.push(x.toISOString().slice(0,10));return r}
function add(v,h,ds,opts,meal,g,n=''){for(const d of ds)for(const [t,r] of opts)D.push({venue:v,hall:h,date:d,time:t,rental:r,meal,guarantee:g,total:r+350*parseInt(meal.match(/\d[\d,]*/)[0].replaceAll(',','')),note:n})}
function gm(ds,spec,disc=false){let meal=disc?'뷔페 63,000원 / 스테이크 74,000원':'뷔페 66,000원 / 스테이크 77,000원';for(const [h,o] of Object.entries(spec))add('그랜드 모먼트',h,ds,o,meal,200,disc?'식대 3,000원 할인 반영':'')}
gm(sat('2027-06-19','2027-06-27'),{'시그니처홀':[['14:00',4000000],['15:00 이후',2500000]],'베일홀':[['14:00',2000000],['15:00 이후',1500000]],'클래식홀':[['14:00',1500000],['15:00 이후',1000000]],'엘라홀':[['14:00 이후',1000000]],'화이트홀':[['14:00 이후',1000000]]});
gm(sat('2027-07-03','2027-07-11'),{'시그니처홀':[['14:00',2000000],['15:00 이후',10000000]],'베일홀':[['14:00 이후',1000000]],'클래식홀':[['14:00 이후',1000000]],'엘라홀':[['14:00 이후',1000000]],'화이트홀':[['14:00 이후',1000000]]},true);
gm(sat('2027-07-17','2027-08-15'),{'시그니처홀':[['14:00 이후',1000000]],'베일홀':[['14:00',1000000],['15:00 이후',500000]],'클래식홀':[['14:00',1000000],['15:00 이후',500000]],'엘라홀':[['14:00',1000000],['15:00 이후',500000]],'화이트홀':[['14:00',1000000],['15:00 이후',500000]]},true);
gm(sat('2027-08-21','2027-08-29'),{'시그니처홀':[['14:00',3500000],['15:00 이후',2000000]],'베일홀':[['14:00',1500000],['15:00 이후',1000000]],'클래식홀':[['14:00',1500000],['15:00 이후',1000000]],'엘라홀':[['14:00 이후',1000000]],'화이트홀':[['14:00 이후',1000000]]},true);
gm(['2027-09-04'],{'시그니처홀':[['15:00 이후',3500000]],'베일홀':[['14:00',4000000],['15:00 이후',3000000]],'클래식홀':[['14:00',3500000],['15:00 이후',2500000]],'엘라홀':[['14:00',3000000],['15:00 이후',2000000]],'화이트홀':[['14:00',2500000],['15:00 이후',1500000]]});
gm(sat('2027-09-11','2027-09-19'),{'시그니처홀':[['14:00 이후',1500000]],'베일홀':[['시간 미지정',1000000]],'클래식홀':[['시간 미지정',1000000]],'엘라홀':[['시간 미지정',1000000]],'화이트홀':[['시간 미지정',1000000]]},true);
gm(sat('2027-09-25','2027-11-30'),{'시그니처홀':[['15:00대',4500000]],'베일홀':[['14:00',7500000],['15:00대',3500000]],'클래식홀':[['14:00',7000000],['15:00대',3000000]],'엘라홀':[['14:00대',6500000],['15:00대',2500000]],'화이트홀':[['14:00',6000000],['15:00',2000000]]});
add('그랜드 블랑','퀸덤홀(화이트홀)',['2027-06-12','2027-06-19'],[['15:00',1500000]],'58,000원',150);add('그랜드 블랑','퀸덤홀(화이트홀)',['2027-06-26'],[['13:30',1500000]],'58,000원',150,'실장 통화 할인 조건');add('그랜드 블랑','퀸덤홀(화이트홀)',['2027-06-26'],[['15:00',1000000]],'58,000원',150,'실장 통화 최신 조건 우선');add('그랜드 블랑','퀸덤홀(화이트홀)',['2027-07-03','2027-08-21','2027-08-28'],[['15:00',1000000]],'54,000원',150);
add('센텀사이언스','1층 더라움홀',['2027-06-26'],[['15:00',500000]],'58,000원',150);for(const d of ['2027-07-03','2027-07-10','2027-08-21','2027-08-28'])add('센텀사이언스','1층 더라움홀',[d],[['14:00',800000],['15:00',700000]],'55,000원',null,'보증인원 미제공');add('센텀사이언스','스카이홀',['2027-08-21'],[['15:30',1000000]],'55,000원',null,'보증인원 미제공 / 6월 스카이홀 전체 마감');add('센텀사이언스','1층 더라움홀',['2027-09-04'],[['14:00',1800000]],'58,000원',null,'보증인원 미제공');add('센텀사이언스','1층 더라움홀',['2027-09-25'],[['15:00',600000]],'58,000원',null,'보증인원 미제공');
const B={};D.forEach(x=>(B[x.date]??=[]).push(x));let cur=new Date(2027,5,1),sd=null,sv=null,sh=null;
function cal(){let y=cur.getFullYear(),m=cur.getMonth();$('mt').textContent=`${y}년 ${m+1}월`;$('cal').innerHTML='';let f=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();for(let i=0;i<f;i++)$('cal').innerHTML+='<div class="d e"></div>';for(let n=1;n<=last;n++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,e=document.createElement('div');e.className='d'+(B[ds]?' on':'')+(sd==ds?' sel':'');e.innerHTML=`<b>${n}</b>${B[ds]?`<div class="muted">${new Set(B[ds].map(x=>x.venue)).size}곳</div>`:''}`;e.onclick=()=>sel(ds);$('cal').append(e)}}
function sel(ds){sd=ds;cal();let a=B[ds]||[];$('dl').textContent=ds;$('vt').innerHTML=$('ht').innerHTML=$('res').innerHTML='';if(!a.length){$('res').innerHTML='<p>등록된 정보 없음</p>';return}sv=[...new Set(a.map(x=>x.venue))][0];vt()}
function vt(){let vs=[...new Set(B[sd].map(x=>x.venue))];$('vt').innerHTML=vs.map(v=>`<button class="tab ${v==sv?'a':''}">${v}</button>`).join('');[...$('vt').children].forEach((b,i)=>b.onclick=()=>{sv=vs[i];sh=null;vt()});ht()}
function ht(){let a=B[sd].filter(x=>x.venue==sv),hs=[...new Set(a.map(x=>x.hall))];if(!sh||!hs.includes(sh))sh=hs[0];$('ht').innerHTML=hs.map(h=>`<button class="tab ${h==sh?'a':''}">${h}</button>`).join('');[...$('ht').children].forEach((b,i)=>b.onclick=()=>{sh=hs[i];ht()});res()}
function res(){let a=B[sd].filter(x=>x.venue==sv&&x.hall==sh);$('res').innerHTML=a.map(x=>`<div class="card"><div class="top"><b>${x.hall}</b><b>${x.time}</b></div><div class="row"><div class="s"><span class="muted">대관비</span><br><b>${M(x.rental)}</b></div><div class="s"><span class="muted">보증인원</span><br><b>${x.guarantee?x.guarantee+'명':'미제공'}</b></div><div class="s" style="grid-column:1/-1"><span class="muted">식대</span><br><b>${x.meal}</b></div></div><div class="t"><span>350명 예상총액</span><b>${M(x.total)}</b></div>${x.note?`<div class="muted">${x.note}</div>`:''}</div>`).join('')}
$('pv').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);cal()};$('nx').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);cal()};cal();sel(Object.keys(B).sort()[0]);
</script>
