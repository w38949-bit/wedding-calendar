<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>웨딩홀 비교 달력</title><style>:root{--bg:#f6f3ef;--card:#fff;--text:#262320;--muted:#77716b;--line:#e4ddd6;--accent:#7a5c48;--soft:#efe5dc;--strong:#5e4434}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(180deg,#fbf8f4,#f6f3ef);color:var(--text)}main{max-width:1180px;margin:auto;padding:30px 18px 60px}h1{margin:0;font-size:34px}.sub{margin:7px 0 22px;color:var(--muted);font-size:14px}.g{display:grid;grid-template-columns:1.05fr .95fr;gap:22px}.p{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(70,52,40,.08)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h2{margin:0}.nav{display:flex;gap:7px}.nav button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px}.cal,.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.wk{margin:12px 0 4px}.wk div{text-align:center;color:var(--muted);font-size:12px}.d{min-height:76px;border:1px solid var(--line);border-radius:13px;padding:8px;cursor:pointer;background:#fff;position:relative}.d.on{background:#fcf7f2}.d.sel{outline:2px solid var(--accent);background:#fffaf6}.d.e{visibility:hidden}.count{position:absolute;left:8px;bottom:7px;color:var(--muted);font-size:11px}.label{font-size:12px;color:var(--muted);margin:14px 0 7px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:700;cursor:pointer}.tab.a{background:var(--accent);color:#fff;border-color:var(--accent)}.hall .tab{border-radius:12px;background:#faf7f4}.hall .tab.a{background:var(--soft);color:var(--strong);border-color:#cdb9aa}.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}.cardhead{display:flex;justify-content:space-between;gap:10px}.time{font-weight:800;color:var(--strong)}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.s{background:#faf7f4;border-radius:11px;padding:11px}.s span,.total span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.s b{font-size:14px}.meal{grid-column:1/-1}.total{background:var(--soft);border-radius:12px;padding:12px;margin-top:11px}.total b{display:block;font-size:20px;color:var(--strong)}.note{margin-top:9px;color:#8a5b4b;font-size:12px}.empty{padding:28px 8px;color:var(--muted);text-align:center;font-size:14px}@media(max-width:850px){.g{grid-template-columns:1fr}.d{min-height:64px}h1{font-size:29px}}</style></head><body><main><h1>웨딩홀 비교 달력</h1><div class="sub">2027년 토요일 · 350명 예상총액 = 대관비 + 350명 식대 · 연출비/주류비 제외</div><div class="g"><section class="p"><div class="top"><h2 id="mt"></h2><div class="nav"><button id="pv">← 이전</button><button id="nx">다음 →</button></div></div><div class="wk"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div id="cal" class="cal"></div></section><section class="p"><h2 id="dl">날짜를 선택하세요</h2><div class="label">웨딩홀</div><div id="vt" class="tabs"></div><div class="label">내부 홀</div><div id="ht" class="tabs hall"></div><div id="res"></div></section></div></main><script>const D=[],$=id=>document.getElementById(id),M=n=>n==null?'미제공':n.toLocaleString('ko-KR')+'원';function sat(a,b){let x=new Date(a+'T00:00:00'),z=new Date(b+'T00:00:00'),r=[];while(x.getDay()!=6)x.setDate(x.getDate()+1);for(;x<=z;x.setDate(x.getDate()+7))r.push(x.toISOString().slice(0,10));return r}function price(meal){let m=meal.match(/\d[\d,]*/);return m?+m[0].replaceAll(',',''):null}function add(v,h,ds,opts,meal,g,n=''){for(const d of ds)for(const [t,r] of opts)D.push({venue:v,hall:h,date:d,time:t,rental:r,meal,guarantee:g,total:r==null?null:r+350*price(meal),note:n})}function gm(ds,spec,disc=false){let meal=disc?'뷔페 63,000원 / 스테이크 74,000원':'뷔페 66,000원 / 스테이크 77,000원';for(const [h,o] of Object.entries(spec))add('그랜드 모먼트',h,ds,o,meal,200,disc?'식대 3,000원 할인 반영':'')}gm(sat('2027-06-19','2027-06-27'),{'시그니처홀':[['14:00',4000000],['15:00 이후',2500000]],'베일홀':[['14:00',2000000],['15:00 이후',1500000]],'클래식홀':[['14:00',1500000],['15:00 이후',1000000]],'엘라홀':[['14:00 이후',1000000]],'화이트홀':[['14:00 이후',1000000]]});gm(sat('2027-07-03','2027-07-11'),{'시그니처홀':[['14:00',2000000],['15:00 이후',10000000]],'베일홀':[['14:00 이후',1000000]],'클래식홀':[['14:00 이후',1000000]],'엘라홀':[['14:00 이후',1000000]],'화이트홀':[['14:00 이후',1000000]]},true);gm(sat('2027-07-17','2027-08-15'),{'시그니처홀':[['14:00 이후',1000000]],'베일홀':[['14:00',1000000],['15:00 이후',500000]],'클래식홀':[['14:00',1000000],['15:00 이후',500000]],'엘라홀':[['14:00',1000000],['15:00 이후',500000]],'화이트홀':[['14:00',1000000],['15:00 이후',500000]]},true);gm(sat('2027-08-21','2027-08-29'),{'시그니처홀':[['14:00',3500000],['15:00 이후',2000000]],'베일홀':[['14:00',1500000],['15:00 이후',1000000]],'클래식홀':[['14:00',1500000],['15:00 이후',1000000]],'엘라홀':[['14:00 이후',1000000]],'화이트홀':[['14:00 이후',1000000]]},true);gm(['2027-09-04'],{'시그니처홀':[['15:00 이후',3500000]],'베일홀':[['14:00',4000000],['15:00 이후',3000000]],'클래식홀':[['14:00',3500000],['15:00 이후',2500000]],'엘라홀':[['14:00',3000000],['15:00 이후',2000000]],'화이트홀':[['14:00',2500000],['15:00 이후',1500000]]});gm(sat('2027-09-11','2027-09-19'),{'시그니처홀':[['14:00 이후',1500000]],'베일홀':[['시간 미지정',1000000]],'클래식홀':[['시간 미지정',1000000]],'엘라홀':[['시간 미지정',1000000]],'화이트홀':[['시간 미지정',1000000]]},true);gm(sat('2027-09-25','2027-11-30'),{'시그니처홀':[['15:00대',4500000]],'베일홀':[['14:00',7500000],['15:00대',3500000]],'클래식홀':[['14:00',7000000],['15:00대',3000000]],'엘라홀':[['14:00대',6500000],['15:00대',2500000]],'화이트홀':[['14:00',6000000],['15:00',2000000]]});add('그랜드 블랑','퀸덤홀(화이트홀)',['2027-06-12','2027-06-19'],[['15:00',1500000]],'58,000원',150);add('그랜드 블랑','퀸덤홀(화이트홀)',['2027-06-26'],[['13:30',1500000]],'58,000원',150,'실장 통화 할인 조건');add('그랜드 블랑','퀸덤홀(화이트홀)',['2027-06-26'],[['15:00',1000000]],'58,000원',150,'실장 통화 최신 조건 우선');add('그랜드 블랑','퀸덤홀(화이트홀)',['2027-07-03','2027-08-21','2027-08-28'],[['15:00',1000000]],'54,000원',150);add('센텀사이언스','1층 더라움홀',['2027-06-26'],[['15:00',500000]],'58,000원',150);for(const d of ['2027-07-03','2027-07-10','2027-08-21','2027-08-28'])add('센텀사이언스','1층 더라움홀',[d],[['14:00',800000],['15:00',700000]],'55,000원',null,'보증인원 미제공');add('센텀사이언스','스카이홀',['2027-08-21'],[['15:30',1000000]],'55,000원',null,'보증인원 미제공 / 6월 스카이홀 전체 마감');add('센텀사이언스','1층 더라움홀',['2027-09-04'],[['14:00',1800000]],'58,000원',null,'보증인원 미제공');add('센텀사이언스','1층 더라움홀',['2027-09-25'],[['15:00',600000]],'58,000원',null,'보증인원 미제공');add('해운대 마리나컨벤션','홀명 미제공',['2027-06-05','2027-06-12'],[['15:30',null]],'52,000원',150,'대관비 미제공');add('해운대 마리나컨벤션','홀명 미제공',['2027-06-19','2027-06-26'],[['13:20',800000],['14:30',600000],['15:30',500000]],'52,000원',150);add('해운대 마리나컨벤션','홀명 미제공',['2027-07-03','2027-07-10'],[['12:00',500000],['13:20',500000],['14:30',500000],['15:30',500000]],'49,000원',150);add('해운대 마리나컨벤션','홀명 미제공',['2027-08-21','2027-08-28'],[['13:20',500000],['14:30',500000],['15:30',500000]],'49,000원',150);add('해운대 마리나컨벤션','홀명 미제공',['2027-09-04','2027-09-25'],[['14:30',600000],['15:30',500000]],'52,000원',150);const B={};D.forEach(x=>(B[x.date]??=[]).push(x));let cur=new Date(2027,5,1),sd=null,sv=null,sh=null;function cal(){let y=cur.getFullYear(),m=cur.getMonth();$('mt').textContent=`${y}년 ${m+1}월`;$('cal').innerHTML='';let f=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();for(let i=0;i<f;i++)$('cal').innerHTML+='<div class="d e"></div>';for(let n=1;n<=last;n++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,e=document.createElement('div');e.className='d'+(B[ds]?' on':'')+(sd===ds?' sel':'');e.innerHTML=`<b>${n}</b>${B[ds]?`<div class="count">${new Set(B[ds].map(x=>x.venue)).size}곳</div>`:''}`;e.onclick=()=>sel(ds);$('cal').append(e)}}function sel(ds){sd=ds;cal();let a=B[ds]||[];$('dl').textContent=ds;$('vt').innerHTML=$('ht').innerHTML=$('res').innerHTML='';if(!a.length){$('res').innerHTML='<div class="empty">등록된 견적 정보가 없습니다.</div>';return}sv=[...new Set(a.map(x=>x.venue))][0];vt()}function vt(){let vs=[...new Set(B[sd].map(x=>x.venue))];$('vt').innerHTML=vs.map(v=>`<button class="tab ${v===sv?'a':''}">${v}</button>`).join('');[...$('vt').children].forEach((b,i)=>b.onclick=()=>{sv=vs[i];sh=null;vt()});ht()}function ht(){let a=B[sd].filter(x=>x.venue===sv),hs=[...new Set(a.map(x=>x.hall))];if(!sh||!hs.includes(sh))sh=hs[0];$('ht').innerHTML=hs.map(h=>`<button class="tab ${h===sh?'a':''}">${h}</button>`).join('');[...$('ht').children].forEach((b,i)=>b.onclick=()=>{sh=hs[i];ht()});res()}function res(){let a=B[sd].filter(x=>x.venue===sv&&x.hall===sh).sort((a,b)=>a.time.localeCompare(b.time,'ko'));$('res').innerHTML=a.map(x=>`<div class="card"><div class="cardhead"><b>${x.venue} · ${x.hall}</b><div class="time">${x.time}</div></div><div class="row"><div class="s"><span>대관비</span><b>${M(x.rental)}</b></div><div class="s"><span>보증인원</span><b>${x.guarantee?x.guarantee+'명':'미제공'}</b></div><div class="s meal"><span>식대</span><b>${x.meal}</b></div></div><div class="total"><span>350명 예상총액</span><b>${x.total==null?'대관비 확인 필요':M(x.total)}</b></div>${x.note?`<div class="note">${x.note}</div>`:''}</div>`).join('')} $('pv').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);cal()};$('nx').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);cal()};cal();sel(Object.keys(B).sort()[0]);</script></body></html>
